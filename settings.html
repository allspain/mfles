<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFL Enhancement Suite — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 48px 24px;
    }
    .page { max-width: 560px; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #21262d;
    }
    .logo { width: 32px; height: 32px; border-radius: 7px; }
    h1 { font-size: 20px; font-weight: 700; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .feature-list {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      overflow: hidden;
    }
    .feature-row {
      border-bottom: 1px solid #21262d;
    }
    .feature-row:last-child { border-bottom: none; }

    .feature-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      gap: 16px;
    }
    .feature-info { flex: 1; min-width: 0; }
    .feature-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 3px;
      cursor: pointer;
    }
    .feature-desc {
      font-size: 12px;
      color: #8b949e;
    }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: #30363d;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 2px; top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-track { background: #3fb950; }
    .toggle input:checked + .toggle-track::before { transform: translateX(18px); }

    /* Inline params */
    .feature-params {
      padding: 10px 16px 14px 32px;
      border-top: 1px solid #21262d;
      background: #0d1117;
    }
    .feature-params.hidden { display: none; }
    .param-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .param-row:last-child { margin-bottom: 0; }
    .param-info { flex: 1; }
    .param-label { font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 2px; }
    .param-desc { font-size: 11px; color: #484f58; }
    .param-control { display: flex; align-items: center; gap: 8px; }
    .param-control input[type=range] { width: 80px; accent-color: #3fb950; }
    .param-value { font-size: 12px; color: #8b949e; width: 32px; text-align: right; }

    /* Pro row */
    .feature-row--pro .feature-main { opacity: 0.6; }
    .badge-pro {
      font-size: 11px;
      font-weight: 600;
      color: #bc8cff;
      background: #1a1430;
      border: 1px solid #3d2b6b;
      border-radius: 4px;
      padding: 3px 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <img class="logo" src="icons/48.png" alt="">
      <h1>Settings</h1>
    </div>
    <div class="section-label">Features</div>
    <div class="feature-list" id="feature-list">
      <!-- Populated by settings.js -->
    </div>
  </div>
  <script src="src/features.js"></script>
  <script src="src/migrations.js"></script>
  <script src="src/settings-sync.js"></script>
  <script src="src/settings.js"></script>
  <script src="settings.js"></script>
</body>
</html>
